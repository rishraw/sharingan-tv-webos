<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sharingan TV</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="scene" class="theme-itachi" role="application" aria-label="Sharingan TV launcher">
  <div id="stars" aria-hidden="true"></div><div id="moon" aria-hidden="true"></div><div id="art" aria-hidden="true"></div><div id="shade" aria-hidden="true"></div><div id="embers" aria-hidden="true"></div><div id="focusAura" aria-hidden="true"></div><div id="eyeRig" aria-hidden="true"><span class="eyeLight eyeLeft"></span><span class="eyeLight eyeRight"></span></div>
  <header>
    <div class="timebox"><div id="clock" aria-label="Local time"></div><div id="date"></div></div>
    <div id="topActions"><button type="button" class="topbtn actionable" data-command="settings"><span class="topicon">⚙</span> Settings</button><button type="button" class="topbtn actionable" data-command="themes"><span class="topicon">◉</span> Themes</button></div>
  </header>
  <div id="identity"><h1 id="character">ITACHI UCHIHA</h1><span class="tagline" id="tagline">THE SHADOW OF THE LEAF</span></div>
  <section id="dockSection" aria-label="Favorite applications"><div id="dock"></div></section>
  <div id="toast" class="hidden" role="status" aria-live="polite"></div>
  <div id="backdrop" class="hidden"></div>
  <aside id="panel" class="hidden" aria-label="Menu"><div class="panelHeader"><div><div class="eyebrow">CONTROLS</div><h2 id="panelTitle">Themes</h2></div><button class="closeBtn actionable" type="button" data-command="close" aria-label="Close panel">✕</button></div><div id="panelContent"></div><div class="panelFooter">▲ ▼ Navigate &nbsp; · &nbsp; OK Select &nbsp; · &nbsp; Back Close</div></aside>
</div>
<script src="script.js"></script>
</body></html>
